name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-install:
    name: Install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run action (install only, vault will fail)
        uses: ./
        with:
          murk-key: 'AGE-SECRET-KEY-1DUMMY'
          vault: 'nonexistent.murk'
        continue-on-error: true

      - name: Verify murk is installed and on PATH
        run: murk --version

  test-export:
    name: Export, murk 0.13 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create test vault
        run: |
          # Install murk to create the test vault. Pinned to 0.13, the last
          # release before signer trust; test-trusted-signers covers 0.14.
          VERSION="0.13.0"

          case "$RUNNER_OS" in
            Linux)  TARGET="x86_64-unknown-linux-gnu" ;;
            macOS)  TARGET="aarch64-apple-darwin" ;;
          esac

          ARCHIVE="murk-v${VERSION}-${TARGET}.tar.gz"
          gh release download "v${VERSION}" \
            --repo interrupted-sh/murk \
            --pattern "$ARCHIVE" \
            --dir /tmp

          tar xzf "/tmp/${ARCHIVE}" -C /tmp

          # Create vault and extract key.
          echo "ci-test" | /tmp/murk init --vault test.murk

          # init writes MURK_KEY_FILE reference; read the actual key from the file.
          KEY_FILE=$(sed -n "s/^export MURK_KEY_FILE='\\(.*\\)'/\\1/p" .env)
          if [ -n "$KEY_FILE" ]; then
            MURK_KEY=$(cat "$KEY_FILE")
          else
            MURK_KEY=$(sed -n 's/^export MURK_KEY=//p' .env)
          fi

          # Add test secrets.
          echo "hello_world" | MURK_KEY="$MURK_KEY" /tmp/murk add GREETING --vault test.murk
          printf "it's got quotes" | MURK_KEY="$MURK_KEY" /tmp/murk add QUOTED_VAL --vault test.murk
          echo 'val with $pecial chars & stuff' | MURK_KEY="$MURK_KEY" /tmp/murk add SPECIAL --vault test.murk

          # Save key for next step.
          echo "TEST_MURK_KEY=$MURK_KEY" >> "$GITHUB_ENV"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Run murk-action
        uses: ./
        with:
          murk-key: ${{ env.TEST_MURK_KEY }}
          version: '0.13.0'
          vault: 'test.murk'
          # murk 0.13 ignores trusted-signers, so setting it must change nothing.
          trusted-signers: |
            age1qqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqqq:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

      - name: Verify secrets are in environment
        run: |
          test "$GREETING" = "hello_world" || { echo "FAIL: GREETING='$GREETING'"; exit 1; }
          test "$QUOTED_VAL" = "it's got quotes" || { echo "FAIL: QUOTED_VAL mismatch"; exit 1; }

          test "$SPECIAL" = 'val with $pecial chars & stuff' || { echo "FAIL: SPECIAL mismatch"; exit 1; }

          echo "All assertions passed"

  test-trusted-signers:
    name: Trusted signers, murk 0.14 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install murk 0.14 (vault will fail)
        uses: ./
        with:
          murk-key: 'AGE-SECRET-KEY-1DUMMY'
          version: '0.14.0'
          vault: 'nonexistent.murk'
        continue-on-error: true

      - name: Export step on a fresh runner (unset, wrong and trusted signers)
        run: test/trusted-signers.sh

      - name: Create test vault signed by another machine
        run: |
          # The author's HOME holds their key and trust pin, so this runner's
          # HOME stays as fresh as a CI runner's.
          AUTHOR_HOME="${RUNNER_TEMP}/author-home"
          mkdir -p "$AUTHOR_HOME"
          echo "ci-test" | HOME="$AUTHOR_HOME" murk init --vault test.murk
          MURK_KEY=$(cat "$(sed -n "s/^export MURK_KEY_FILE='\\(.*\\)'/\\1/p" .env)")
          echo "hello_world" | HOME="$AUTHOR_HOME" MURK_KEY="$MURK_KEY" murk add GREETING --vault test.murk
          {
            echo "TEST_MURK_KEY=$MURK_KEY"
            echo "TEST_SIGNER=$(HOME="$AUTHOR_HOME" MURK_KEY="$MURK_KEY" murk trust --print-key)"
          } >> "$GITHUB_ENV"

      # Runs before the trusted run: an accepted load records a trust pin in
      # this runner's HOME, after which the vault would load without the input.
      - name: Run murk-action without trusted-signers
        id: untrusted
        uses: ./
        with:
          murk-key: ${{ env.TEST_MURK_KEY }}
          version: '0.14.0'
          vault: 'test.murk'
        continue-on-error: true

      - name: Verify the action refused it
        run: |
          test "${{ steps.untrusted.outcome }}" = "failure" || { echo "FAIL: untrusted vault was loaded"; exit 1; }
          test "${{ steps.untrusted.outputs.version }}" = "0.14.0" || { echo "FAIL: murk 0.14.0 was not installed, so the failure proves nothing"; exit 1; }
          test -z "${GREETING:-}" || { echo "FAIL: GREETING was exported"; exit 1; }

      - name: Run murk-action with trusted-signers
        uses: ./
        with:
          murk-key: ${{ env.TEST_MURK_KEY }}
          version: '0.14.0'
          vault: 'test.murk'
          trusted-signers: ${{ env.TEST_SIGNER }}

      - name: Verify secrets are in environment
        run: |
          test "$GREETING" = "hello_world" || { echo "FAIL: GREETING='$GREETING'"; exit 1; }

  test-version-pin:
    name: Version pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run with pinned version
        uses: ./
        with:
          murk-key: 'AGE-SECRET-KEY-1DUMMY'
          version: '0.11.0'
          vault: 'nonexistent.murk'
        continue-on-error: true

      - name: Verify pinned version
        run: murk --version | grep -q "0.11.0"

  test-unsigned-version:
    name: Refuse unsigned version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run with a release that predates signing
        id: unsigned
        uses: ./
        with:
          murk-key: 'AGE-SECRET-KEY-1DUMMY'
          version: '0.10.1'
          vault: 'nonexistent.murk'
        continue-on-error: true

      - name: Verify the action refused it
        run: |
          test "${{ steps.unsigned.outcome }}" = "failure" || { echo "FAIL: unsigned release was accepted"; exit 1; }
          if command -v murk >/dev/null 2>&1; then echo "FAIL: murk was installed"; exit 1; fi

name: 'murk-action'
description: 'Decrypt murk secrets and inject into CI environment'
branding:
  icon: 'lock'
  color: 'gray-dark'

inputs:
  murk-key:
    description: 'Age secret key (AGE-SECRET-KEY-1...), or a whole murk agent grant key file (its "# murk-..." comment lines and its AGE-SECRET-KEY-1... line), passed to murk unchanged'
    required: true
  version:
    description: 'murk version to install, 0.10.2 or newer (e.g. "0.14.0" or "latest"); murk 0.14 and later need trusted-signers or a whole grant key file as murk-key'
    required: false
    default: 'latest'
  vault:
    description: 'Path to vault file'
    required: false
    default: '.murk'
  tags:
    description: 'Space-separated tags to filter exported secrets'
    required: false
    default: ''
  trusted-signers:
    description: 'Signers trusted to sign the vault, one per line or comma-separated: each signer''s `murk trust --print-key` output. Required by murk 0.14 and later; ignored by older murk'
    required: false
    default: ''

outputs:
  version:
    description: 'Installed murk version'
    value: ${{ steps.install.outputs.version }}
  keys:
    description: 'Space-separated list of exported key names'
    value: ${{ steps.export.outputs.keys }}

runs:
  using: 'composite'
  steps:
    - name: Install murk
      id: install
      shell: bash
      run: |
        set -euo pipefail

        # Map runner platform to murk release target.
        case "$RUNNER_OS" in
          Linux)
            case "$RUNNER_ARCH" in
              X64)   TARGET="x86_64-unknown-linux-gnu" ;;
              ARM64) TARGET="aarch64-unknown-linux-gnu" ;;
              ARM)   TARGET="arm-unknown-linux-gnueabihf" ;;
              *)     echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
            esac
            ;;
          macOS)
            case "$RUNNER_ARCH" in
              X64)   TARGET="x86_64-apple-darwin" ;;
              ARM64) TARGET="aarch64-apple-darwin" ;;
              *)     echo "::error::Unsupported architecture: $RUNNER_ARCH"; exit 1 ;;
            esac
            ;;
          *)
            echo "::error::Unsupported OS: $RUNNER_OS"
            exit 1
            ;;
        esac

        # Resolve version.
        VERSION="${{ inputs.version }}"
        if [ "$VERSION" = "latest" ]; then
          VERSION=$(gh release view --repo interrupted-sh/murk --json tagName --jq '.tagName')
          VERSION="${VERSION#v}"
          echo "::warning::murk-action resolved to v${VERSION} — pin 'version: ${VERSION}' for reproducible builds"
        fi
        VERSION="${VERSION#v}"

        # Only releases from v0.10.2 on carry build-provenance attestations.
        if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
          echo "::error::Invalid murk version '${VERSION}' — expected MAJOR.MINOR.PATCH"
          exit 1
        fi
        MAJOR=$((10#${BASH_REMATCH[1]})) MINOR=$((10#${BASH_REMATCH[2]})) PATCH=$((10#${BASH_REMATCH[3]}))
        if (( MAJOR == 0 && (MINOR < 10 || (MINOR == 10 && PATCH < 2)) )); then
          echo "::error::murk-action requires murk 0.10.2 or newer because older releases are not signed (requested v${VERSION})"
          exit 1
        fi

        # Download and extract.
        ARCHIVE="murk-v${VERSION}-${TARGET}.tar.gz"
        INSTALL_DIR="${RUNNER_TEMP}/murk-bin"
        mkdir -p "$INSTALL_DIR"

        # --clobber: an earlier run of this action in the same job left these
        # files in RUNNER_TEMP; both are verified below either way.
        gh release download "v${VERSION}" \
          --repo interrupted-sh/murk \
          --pattern "$ARCHIVE" \
          --pattern "SHA256SUMS" \
          --dir "$RUNNER_TEMP" \
          --clobber

        # Verify checksum (shasum for macOS portability).
        EXPECTED=$(grep -F "$ARCHIVE" "${RUNNER_TEMP}/SHA256SUMS" | cut -d' ' -f1)
        if command -v sha256sum >/dev/null 2>&1; then
          ACTUAL=$(sha256sum "${RUNNER_TEMP}/${ARCHIVE}" | cut -d' ' -f1)
        else
          ACTUAL=$(shasum -a 256 "${RUNNER_TEMP}/${ARCHIVE}" | cut -d' ' -f1)
        fi
        if [ "$ACTUAL" != "$EXPECTED" ]; then
          echo "::error::Checksum mismatch for $ARCHIVE — expected $EXPECTED, got $ACTUAL"
          exit 1
        fi

        # Verify build provenance attestation; refuse unsigned or tampered binaries.
        # Releases built before the org rename (0.10.2–0.11.0) are signed as
        # interrupted-inc/murk: fetch their attestation from the current repo, then
        # verify the bundle against the old signing identity.
        BUNDLE="${RUNNER_TEMP}/sha256:${ACTUAL}.jsonl"
        if ! gh attestation verify "${RUNNER_TEMP}/${ARCHIVE}" --repo interrupted-sh/murk 2>/dev/null \
          && ! { (cd "$RUNNER_TEMP" && gh attestation download "$ARCHIVE" --repo interrupted-sh/murk >/dev/null 2>&1) \
            && gh attestation verify "${RUNNER_TEMP}/${ARCHIVE}" --bundle "$BUNDLE" --repo interrupted-inc/murk 2>/dev/null; }; then
          echo "::error::No valid build-provenance attestation for $ARCHIVE — refusing to install"
          exit 1
        fi

        tar xzf "${RUNNER_TEMP}/${ARCHIVE}" -C "$INSTALL_DIR"

        # Add to PATH for subsequent steps.
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

        # Verify and expose version.
        "${INSTALL_DIR}/murk" --version
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Export secrets
      id: export
      shell: bash
      run: |
        set -euo pipefail

        # Validate the key: a bare age secret key line, or a whole grant key
        # file whose "# murk-trusted-signer:", "# murk-grant-id:" and
        # "# murk-grant-expires:" lines murk reads and enforces. MURK_KEY reaches
        # murk unchanged. Never echo a line of it: only the secret line is
        # masked, and a multi-line ::add-mask:: would print the lines after the
        # first.
        KEY_LINE=""
        while IFS= read -r line || [ -n "$line" ]; do
          line="${line%$'\r'}"
          case "$line" in
            '' | '#'*) ;;
            AGE-SECRET-KEY-1*)
              echo "::add-mask::${line}"
              if [ -n "$KEY_LINE" ]; then
                echo "::error::murk-key holds more than one AGE-SECRET-KEY-1... line"
                exit 1
              fi
              KEY_LINE="$line"
              ;;
            *)
              echo "::error::murk-key must be an age secret key (AGE-SECRET-KEY-1...) or a murk grant key file (# comment lines and one AGE-SECRET-KEY-1... line)"
              exit 1
              ;;
          esac
        done <<< "$MURK_KEY"
        if [ -z "$KEY_LINE" ]; then
          echo "::error::murk-key does not look like an age secret key (expected AGE-SECRET-KEY-1...)"
          exit 1
        fi

        # Build --tag arguments.
        TAG_ARGS=""
        if [ -n "$INPUT_TAGS" ]; then
          for tag in $INPUT_TAGS; do
            TAG_ARGS="$TAG_ARGS --tag $tag"
          done
        fi

        # murk 0.14 and later only load a vault whose signer this machine
        # trusts. A fresh runner has no trust pin, so trust comes from
        # MURK_TRUSTED_SIGNERS. Older murk ignores it. Set it only when the input
        # is given, so a MURK_TRUSTED_SIGNERS from the job's env still applies.
        if [ -n "$INPUT_TRUSTED_SIGNERS" ]; then
          export MURK_TRUSTED_SIGNERS="$INPUT_TRUSTED_SIGNERS"
        fi

        # Run murk export (word splitting on TAG_ARGS is intentional). Keep
        # stderr to explain a trust refusal; it holds no secret values.
        ERR_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/murk-export.XXXXXX")
        # shellcheck disable=SC2086
        if ! MURK_EXPORT=$(murk export --vault "$INPUT_VAULT" $TAG_ARGS 2>"$ERR_FILE"); then
          cat "$ERR_FILE" >&2
          # The backticks below are literal text, not command substitution.
          # shellcheck disable=SC2016
          if [ -z "${MURK_TRUSTED_SIGNERS:-}" ] && grep -q 'murk trust' "$ERR_FILE"; then
            printf '::error::murk refused %s because its signer is not trusted on this runner. Set the trusted-signers input to the `murk trust --print-key` output of each teammate who signs the vault (murk 0.14 and later).\n' "$INPUT_VAULT"
          elif [ -n "${MURK_TRUSTED_SIGNERS:-}" ] && grep -qE 'not a trusted signer|signing key that is not theirs' "$ERR_FILE"; then
            printf '::error::murk refused %s because its signer does not match trusted-signers. Each entry must be the `murk trust --print-key` output of a teammate who signs the vault.\n' "$INPUT_VAULT"
          elif grep -q 'grant key names no trusted signers' "$ERR_FILE"; then
            printf '::error::murk-key is a grant key without its trusted signers. Paste the whole key file from `murk agent grant ... --out -` into murk-key, comment lines included, or set trusted-signers.\n'
          fi
          rm -f "$ERR_FILE"
          exit 1
        fi
        cat "$ERR_FILE" >&2
        rm -f "$ERR_FILE"

        if [ -z "$MURK_EXPORT" ]; then
          echo "::notice::No secrets exported from vault"
          exit 0
        fi

        # Extract key names from export lines: "export KEY='...'" → "KEY"
        KEYS=$(echo "$MURK_EXPORT" | sed -n "s/^export \([A-Za-z_][A-Za-z_0-9]*\)=.*/\1/p")

        # eval handles murk's single-quote escaping correctly.
        eval "$MURK_EXPORT"

        # Random delimiter prevents injection via crafted secret values.
        DELIM="MURK_EOF_$(head -c 16 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 24)"

        COUNT=0
        for KEY in $KEYS; do
          VALUE="${!KEY}"

          # Mask non-empty values so they don't appear in logs.
          # Mask the full value and each individual line (multiline values
          # would otherwise leak per-line content in log output).
          if [ -n "$VALUE" ]; then
            echo "::add-mask::${VALUE}"
            while IFS= read -r line; do
              if [ -n "$line" ]; then
                echo "::add-mask::${line}"
              fi
            done <<< "$VALUE"
          fi

          # Write to GITHUB_ENV using delimiter syntax (handles multiline, special chars).
          {
            echo "${KEY}<<${DELIM}"
            printf '%s' "${VALUE}"
            echo
            echo "${DELIM}"
          } >> "$GITHUB_ENV"

          COUNT=$((COUNT + 1))
        done

        echo "::notice::Exported ${COUNT} secret(s) from ${INPUT_VAULT}"
        echo "keys=$(echo $KEYS)" >> "$GITHUB_OUTPUT"
      env:
        MURK_KEY: ${{ inputs.murk-key }}
        INPUT_VAULT: ${{ inputs.vault }}
        INPUT_TAGS: ${{ inputs.tags }}
        INPUT_TRUSTED_SIGNERS: ${{ inputs.trusted-signers }}
